<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서비스 이용약관 — 오늘 한 줄</title>
  <meta name="description" content="오늘 한 줄 서비스의 이용약관입니다." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>"
    type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .legal-page {
      padding-top: 120px;
      padding-bottom: 80px;
      min-height: 100vh;
    }

    .legal-content {
      max-width: 720px;
      margin: 0 auto;
    }

    .legal-content h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--warm-800);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .legal-date {
      font-size: 0.9rem;
      color: var(--warm-400);
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--warm-200);
    }

    .legal-section {
      margin-bottom: 36px;
    }

    .legal-section h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--warm-800);
      margin-bottom: 12px;
    }

    .legal-section p,
    .legal-section li {
      font-size: 0.95rem;
      color: var(--warm-600);
      line-height: 1.8;
    }

    .legal-section ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .legal-section ul li {
      padding: 4px 0 4px 16px;
      position: relative;
    }

    .legal-section ul li::before {
      content: '·';
      position: absolute;
      left: 4px;
      color: var(--warm-400);
      font-weight: 700;
    }

    .legal-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--warm-500);
      margin-bottom: 32px;
      transition: color var(--transition);
    }

    .legal-back:hover {
      color: var(--warm-800);
    }

    .legal-loading {
      text-align: center;
      padding: 40px 0;
      color: var(--warm-400);
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <!-- 네비게이션 -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">✍️ 오늘 한 줄</a>
      <div class="nav-links">
        <a href="index.html#features">기능</a>
        <a href="index.html#how-it-works">사용 방법</a>
        <a href="index.html#categories">카테고리</a>
        <a href="index.html#download" class="nav-cta">출시 준비중</a>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="메뉴 열기">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html#features">기능</a>
      <a href="index.html#how-it-works">사용 방법</a>
      <a href="index.html#categories">카테고리</a>
      <a href="index.html#download" class="nav-cta">출시 준비중</a>
    </div>
  </nav>

  <!-- 서비스 이용약관 -->
  <section class="legal-page">
    <div class="container">
      <div class="legal-content">
        <a href="index.html" class="legal-back">← 홈으로 돌아가기</a>
        <div id="legalBody">
          <p class="legal-loading">불러오는 중...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <span class="footer-logo">✍️ 오늘 한 줄</span>
          <p>매일 한 줄로 마음을 나눠요</p>
        </div>
        <div class="footer-links">
          <div class="footer-col">
            <h4>서비스</h4>
            <a href="index.html#features">기능 소개</a>
            <a href="index.html#how-it-works">사용 방법</a>
            <a href="index.html#categories">카테고리</a>
          </div>
          <div class="footer-col">
            <h4>법적 고지</h4>
            <a href="terms.html">이용약관</a>
            <a href="privacy.html">개인정보처리방침</a>
          </div>
          <div class="footer-col">
            <h4>고객지원</h4>
            <a href="mailto:support@todayjust.app">문의하기</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 오늘 한 줄. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    // Navigation scroll effect
    window.addEventListener('scroll', () => {
      document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
    });

    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
      mobileMenuBtn.classList.toggle('active');
    });

    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
        mobileMenuBtn.classList.remove('active');
      });
    });

    // Load legal content from JSON
    function renderLegalContent(data) {
      const container = document.getElementById('legalBody');
      let html = '';

      html += `<h1>${data.title}</h1>`;
      html += `<p class="legal-date">시행일: ${data.effectiveDate}</p>`;

      if (data.intro) {
        html += `<div class="legal-section"><p>${data.intro}</p></div>`;
      }

      data.sections.forEach(section => {
        html += '<div class="legal-section">';
        html += `<h2>${section.title}</h2>`;

        if (section.content) {
          html += `<p>${section.content}</p>`;
        }

        if (section.items) {
          html += '<ul>';
          section.items.forEach(item => {
            html += `<li>${item}</li>`;
          });
          html += '</ul>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
    }

    fetch('legal-content.json')
      .then(res => res.json())
      .then(data => renderLegalContent(data.terms))
      .catch(() => {
        document.getElementById('legalBody').innerHTML =
          '<p class="legal-loading">콘텐츠를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.</p>';
      });
  </script>
</body>

</html>
